apiVersion: apps/v1
kind: Deployment
metadata:
  name: maven-deployment
  namespace: upcloud
spec:
  replicas: 1
  selector:
    matchLabels:
      application: maven
  template:
    metadata:
      name: maven-pod
      labels:
        application: maven
    spec:
      containers:
      - name: maven-container
        image: jagannadhamyuvaraj/maven-web-application:2
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: 300m
            memory: 500Mi
          limits:
            cpu: 400m
            memory: 600Mi
---
apiVersion: v1
kind: Service
metadata:
  name: maven-service
  namespace: upcloud
spec:
  type: NodePort
  selector:
    application: maven
  ports:
  - port: 80
    targetPort: 8080
