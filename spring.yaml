apiVersion: apps/v1
kind: Deployment
metadata:
  name: spring-deployment
  namespace: upcloud
spec:
  replicas: 1
  selector:
    matchLabels:
      application: spring
  template:
    metadata:
      name: spring-pod
      labels:
        application: spring
    spec:
      containers:
      - name: spring-container
        image: jenkins/jenkins:2.587
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: 100m
            memory: 300Mi
          limits:
            cpu: 200m
            memory: 400Mi
---
apiVersion: v1
kind: Service
metadata:
  name: spring-service
  namespace: upcloud
spec:
  type: ClusterIP
  selector:
    application: spring
  ports:
  - port: 80
    targetPort: 8080
